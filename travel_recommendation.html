<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Bar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Barre de navigation -->
  <nav class="navbar">
    <div class="navbar-container">
      
      <!-- Logo et nom du site -->
      <div class="navbar-brand">
        <img src="logo.png" alt="Logo" class="logo">
        <span class="website-name">TravelHub</span>
      </div>

      <!-- Menu de navigation -->
      <ul class="navbar-menu">
        <li><a href="#home" class="nav-link">Home</a></li>
        <li><a href="#about" class="nav-link">About Us</a></li>
        <li><a href="#contact" class="nav-link">Contact Us</a></li>
      </ul>

      <!-- Barre de recherche -->
      <div class="search-container">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Enter a destination or keyword"
        >
        <button id="searchBtn" class="search-btn">
          <span>🔍</span> Search
        </button>
        <button id="resetBtn" class="reset-btn">Reset</button>
      </div>

    </div>
  </nav>

  <!-- Contenu principal -->
  <main class="main-content">
    <section id="home" class="section">
      <h1>Home Page</h1>
      <p>Bienvenue sur notre site de voyage !</p>
    </section>

    <section id="about" class="section">
      <h1>About Us</h1>
      <p>Découvrez notre histoire et notre mission.</p>
    </section>

    <section id="contact" class="section">
      <h1>Contact Us</h1>
      <p>Nous serions heureux de vous entendre !</p>
    </section>

    <!-- Zone de résultats de recherche -->
    <div id="searchResults" class="search-results"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
